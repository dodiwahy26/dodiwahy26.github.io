<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Energy Charge - Gesture AR</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body { background:#000; overflow:hidden; font-family:'Segoe UI',Arial,sans-serif; }
  #container { position:relative; width:100vw; height:100vh; }
  video { position:absolute; top:0; left:0; width:100%; height:100%; object-fit:cover; transform:scaleX(-1); }
  canvas { position:absolute; top:0; left:0; width:100%; height:100%; }
  #ui {
    position:absolute; top:16px; left:16px; z-index:10;
    color:#fff; background:rgba(0,0,0,0.5); padding:10px 16px;
    border-radius:10px; font-size:14px; backdrop-filter:blur(6px);
  }
  #status {
    position:absolute; bottom:24px; left:50%; transform:translateX(-50%);
    color:#fff; font-size:18px; font-weight:bold; text-shadow:0 0 10px #0ff;
    letter-spacing:2px; z-index:10; transition:opacity 0.3s;
  }
  #colorPicker {
    position:absolute; top:16px; right:16px; z-index:10;
    display:flex; gap:8px; background:rgba(0,0,0,0.5); padding:8px; border-radius:10px;
  }
  .swatch {
    width:28px; height:28px; border-radius:50%; cursor:pointer;
    border:2px solid transparent; transition:transform 0.15s;
  }
  .swatch.active { border-color:#fff; transform:scale(1.15); }
  #loading {
    position:absolute; inset:0; display:flex; align-items:center; justify-content:center;
    color:#fff; font-size:18px; background:#000; z-index:20;
  }
</style>
</head>
<body>
<div id="container">
  <div id="loading">Memuat model deteksi tangan...</div>
  <video id="video" playsinline></video>
  <canvas id="canvas"></canvas>
  <div id="ui">✊ Kepal = Charge &nbsp;|&nbsp; 🖐️ Buka = Release</div>
  <div id="colorPicker">
    <div class="swatch active" style="background:#00e5ff" data-color="0,229,255"></div>
    <div class="swatch" style="background:#ff2d55" data-color="255,45,85"></div>
    <div class="swatch" style="background:#a742ff" data-color="167,66,255"></div>
    <div class="swatch" style="background:#ffcc00" data-color="255,204,0"></div>
    <div class="swatch" style="background:#39ff14" data-color="57,255,20"></div>
  </div>
  <div id="status"></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
<script>
const videoEl = document.getElementById('video');
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');
const statusEl = document.getElementById('status');
const loadingEl = document.getElementById('loading');

let W = 0, H = 0;
function resize() {
  W = canvas.width = window.innerWidth;
  H = canvas.height = window.innerHeight;
}
resize();
window.addEventListener('resize', resize);

// ---- Warna aktif ----
let activeColor = [0, 229, 255];
document.querySelectorAll('.swatch').forEach(sw => {
  sw.addEventListener('click', () => {
    document.querySelectorAll('.swatch').forEach(s => s.classList.remove('active'));
    sw.classList.add('active');
    activeColor = sw.dataset.color.split(',').map(Number);
  });
});

// ---- State per tangan ----
// handState: { charge: 0..1, mode: 'idle'|'charging'|'release', burstParticles: [], palm: {x,y}, lastGesture }
const handStates = {};

function makeHandState() {
  return {
    charge: 0,
    mode: 'idle',
    palm: { x: 0, y: 0 },
    swirlParticles: [],
    burstParticles: [],
    lastGesture: 'open',
    shockwave: null
  };
}

// ---- Deteksi gesture: kepal vs terbuka ----
// Bandingkan jarak ujung jari ke pergelangan vs jarak sendi tengah ke pergelangan
function detectFist(landmarks) {
  const wrist = landmarks[0];
  const tips = [8, 12, 16, 20]; // telunjuk, tengah, manis, kelingking
  const mids = [6, 10, 14, 18];
  let foldedCount = 0;
  for (let i = 0; i < tips.length; i++) {
    const tip = landmarks[tips[i]];
    const mid = landmarks[mids[i]];
    const dTip = Math.hypot(tip.x - wrist.x, tip.y - wrist.y);
    const dMid = Math.hypot(mid.x - wrist.x, mid.y - wrist.y);
    if (dTip < dMid) foldedCount++;
  }
  return foldedCount >= 3; // mayoritas jari terlipat = kepal
}

function palmCenter(landmarks) {
  // rata-rata dari wrist + pangkal jari (0,5,9,13,17)
  const idxs = [0, 5, 9, 13, 17];
  let x = 0, y = 0;
  idxs.forEach(i => { x += landmarks[i].x; y += landmarks[i].y; });
  return { x: x / idxs.length, y: y / idxs.length };
}

// ---- Partikel swirl (saat charging) ----
function spawnSwirlParticle(state) {
  const angle = Math.random() * Math.PI * 2;
  const radius = 80 + Math.random() * 120;
  state.swirlParticles.push({
    angle, radius,
    speed: 0.03 + Math.random() * 0.05,
    size: 2 + Math.random() * 3,
    life: 1
  });
}

// ---- Partikel burst (saat release) ----
function spawnBurst(state, cx, cy, power) {
  const count = Math.floor(40 + power * 80);
  for (let i = 0; i < count; i++) {
    const angle = Math.random() * Math.PI * 2;
    const speed = (3 + Math.random() * 10) * (0.5 + power);
    state.burstParticles.push({
      x: cx, y: cy,
      vx: Math.cos(angle) * speed,
      vy: Math.sin(angle) * speed,
      size: 2 + Math.random() * 4,
      life: 1
    });
  }
  state.shockwave = { r: 10, alpha: 1 };
}

function drawGlowCircle(x, y, r, color, alpha) {
  const grad = ctx.createRadialGradient(x, y, 0, x, y, r);
  grad.addColorStop(0, `rgba(${color[0]},${color[1]},${color[2]},${alpha})`);
  grad.addColorStop(0.5, `rgba(${color[0]},${color[1]},${color[2]},${alpha * 0.4})`);
  grad.addColorStop(1, `rgba(${color[0]},${color[1]},${color[2]},0)`);
  ctx.fillStyle = grad;
  ctx.beginPath();
  ctx.arc(x, y, r, 0, Math.PI * 2);
  ctx.fill();
}

function updateAndDrawHand(state, cx, cy, isFist) {
  const color = activeColor;

  if (isFist) {
    state.mode = 'charging';
    state.charge = Math.min(1, state.charge + 0.02);
  } else {
    if (state.mode === 'charging' && state.charge > 0.15) {
      // RELEASE!
      spawnBurst(state, cx, cy, state.charge);
      statusEl.textContent = '⚡ RELEASE!';
      statusEl.style.opacity = 1;
      setTimeout(() => { statusEl.style.opacity = 0; }, 500);
    }
    state.mode = 'idle';
    state.charge = Math.max(0, state.charge - 0.06);
  }

  // Charging visual: swirl partikel ketarik ke tengah
  if (state.mode === 'charging') {
    if (Math.random() < 0.6) spawnSwirlParticle(state);
    drawGlowCircle(cx, cy, 20 + state.charge * 60, color, 0.5 + state.charge * 0.5);

    state.swirlParticles.forEach(p => {
      p.radius -= p.speed * 40 * state.charge;
      p.angle += 0.08;
      p.life -= 0.02;
      const px = cx + Math.cos(p.angle) * p.radius;
      const py = cy + Math.sin(p.angle) * p.radius;
      ctx.beginPath();
      ctx.arc(px, py, p.size, 0, Math.PI * 2);
      ctx.fillStyle = `rgba(${color[0]},${color[1]},${color[2]},${Math.max(0, p.life)})`;
      ctx.fill();
    });
    state.swirlParticles = state.swirlParticles.filter(p => p.radius > 4 && p.life > 0);

    // core inti energi
    drawGlowCircle(cx, cy, 8 + state.charge * 18, [255, 255, 255], 0.7);
  }

  // Shockwave saat release
  if (state.shockwave) {
    const sw = state.shockwave;
    ctx.beginPath();
    ctx.arc(cx, cy, sw.r, 0, Math.PI * 2);
    ctx.strokeStyle = `rgba(${color[0]},${color[1]},${color[2]},${sw.alpha})`;
    ctx.lineWidth = 4;
    ctx.stroke();
    sw.r += 14;
    sw.alpha -= 0.04;
    if (sw.alpha <= 0) state.shockwave = null;
  }

  // Burst partikel
  state.burstParticles.forEach(p => {
    p.x += p.vx;
    p.y += p.vy;
    p.vx *= 0.96;
    p.vy *= 0.96;
    p.life -= 0.02;
    ctx.beginPath();
    ctx.arc(p.x, p.y, p.size * p.life, 0, Math.PI * 2);
    ctx.fillStyle = `rgba(${color[0]},${color[1]},${color[2]},${Math.max(0, p.life)})`;
    ctx.fill();
  });
  state.burstParticles = state.burstParticles.filter(p => p.life > 0);
}

function onResults(results) {
  ctx.clearRect(0, 0, W, H);

  const seenIds = new Set();

  if (results.multiHandLandmarks && results.multiHandLandmarks.length > 0) {
    results.multiHandLandmarks.forEach((landmarks, idx) => {
      seenIds.add(idx);
      if (!handStates[idx]) handStates[idx] = makeHandState();
      const state = handStates[idx];

      const center = palmCenter(landmarks);
      // mirror x karena video di-flip secara visual (scaleX(-1))
      const cx = (1 - center.x) * W;
      const cy = center.y * H;

      const isFist = detectFist(landmarks);
      updateAndDrawHand(state, cx, cy, isFist);
    });
  }

  // tetap render partikel untuk tangan yang barusan hilang dari frame (biar burst tidak mendadak putus)
  Object.keys(handStates).forEach(key => {
    if (!seenIds.has(Number(key))) {
      const state = handStates[key];
      if (state.burstParticles.length > 0 || state.swirlParticles.length > 0 || state.shockwave) {
        updateAndDrawHand(state, W / 2, H / 2, false);
      }
    }
  });
}

const hands = new Hands({
  locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`
});
hands.setOptions({
  maxNumHands: 2,
  modelComplexity: 1,
  minDetectionConfidence: 0.6,
  minTrackingConfidence: 0.6
});
hands.onResults(onResults);

const camera = new Camera(videoEl, {
  onFrame: async () => { await hands.send({ image: videoEl }); },
  width: 640,
  height: 480
});
camera.start().then(() => { loadingEl.style.display = 'none'; })
  .catch(err => { loadingEl.textContent = 'Gagal akses kamera: ' + err.message; });
</script>
</body>
</html>
