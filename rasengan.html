html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Rasengan ⚡</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { background: #000; overflow: hidden; font-family: 'Courier New', monospace; color: #fff; touch-action: none; }
#container { position: relative; width: 100vw; height: 100vh; }
#video { position: absolute; width: 100%; height: 100%; object-fit: cover; transform: scaleX(-1); opacity: 1; }
#three-canvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; }
#canvas2d { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; }
#ui { position: absolute; top: 16px; left: 16px; z-index: 10; background: rgba(0,20,40,0.7); border: 1px solid rgba(100,200,255,0.4); border-radius: 10px; padding: 10px 14px; font-size: 11px; line-height: 1.8; }
#ui .label { color: #66ccff; } #ui .val { color: #fff; font-weight: bold; }
#status { position: absolute; bottom: 30px; left: 50%; transform: translateX(-50%); font-size: 13px; color: rgba(150,220,255,0.9); z-index: 10; background: rgba(0,20,40,0.6); padding: 8px 18px; border-radius: 20px; white-space: nowrap; }
#loading { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; background: linear-gradient(180deg,#001020,#000); z-index: 100; gap: 16px; }
#loading h1 { font-size: 30px; color: #66ccff; letter-spacing: 4px; text-shadow: 0 0 30px #2299ff; }
#loading p { color: #335577; font-size: 13px; }
.spinner { width: 40px; height: 40px; border: 3px solid #112233; border-top-color: #2299ff; border-radius: 50%; animation: spin 0.8s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
#startBtn { padding: 16px 36px; background: rgba(20,100,200,0.3); border: 2px solid #2299ff; color: #aaddff; font-family: inherit; font-size: 16px; border-radius: 30px; cursor: pointer; letter-spacing: 2px; box-shadow: 0 0 20px rgba(20,150,255,0.4); }
</style>
</head>
<body>
<div id="container">
  <video id="video" playsinline muted></video>
  <canvas id="three-canvas"></canvas>
  <canvas id="canvas2d"></canvas>
  <div id="ui">
    <div><span class="label">Tangan: </span><span class="val" id="handCount">0</span></div>
    <div><span class="label">Chakra: </span><span class="val" id="power">0%</span></div>
    <div><span class="label">FPS: </span><span class="val" id="fps">0</span></div>
  </div>
  <div id="status">Buka telapak tangan ke kamera 💉</div>
</div>
<div id="loading">
  <h1>💉 RASENGAN 💉</h1>
  <p id="loadText">Mengumpulkan chakra...</p>
  <div class="spinner" id="spinner"></div>
  <button id="startBtn" style="display:none" onclick="startApp()">💉 Bentuk Rasengan</button>
</div>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands@0.4.1646424915/hands.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils@0.3.1640029074/camera_utils.js"></script>
<script>
const video=document.getElementById('video'),canvas2d=document.getElementById('canvas2d'),ctx=canvas2d.getContext('2d'),loading=document.getElementById('loading'),spinner=document.getElementById('spinner'),startBtn=document.getElementById('startBtn'),loadText=document.getElementById('loadText');
let W,H;
function resize(){W=canvas2d.width=window.innerWidth;H=canvas2d.height=window.innerHeight;if(renderer){renderer.setSize(W,H);camera.aspect=W/H;camera.updateProjectionMatrix();}}
let handLandmarks=[],hands,power=0;
let scene,camera,renderer,rasenganGroup,coreSphere,swirls=[],particles;

function initThree(){
  scene=new THREE.Scene();
  camera=new THREE.PerspectiveCamera(50,window.innerWidth/window.innerHeight,0.1,1000);
  camera.position.z=5;
  renderer=new THREE.WebGLRenderer({canvas:document.getElementById('three-canvas'),alpha:true,antialias:true});
  renderer.setSize(window.innerWidth,window.innerHeight);
  renderer.setPixelRatio(Math.min(window.devicePixelRatio,2));
  rasenganGroup=new THREE.Group();
  scene.add(rasenganGroup);
  const coreGeo=new THREE.SphereGeometry(0.5,32,32);
  const coreMat=new THREE.MeshBasicMaterial({color:0x66ccff,transparent:true,opacity:0.9});
  coreSphere=new THREE.Mesh(coreGeo,coreMat);
  rasenganGroup.add(coreSphere);
  const glowGeo=new THREE.SphereGeometry(0.7,32,32);
  const glowMat=new THREE.MeshBasicMaterial({color:0x2299ff,transparent:true,opacity:0.3,side:THREE.BackSide});
  rasenganGroup.add(new THREE.Mesh(glowGeo,glowMat));
  for(let i=0;i<3;i++){
    const torusGeo=new THREE.TorusGeometry(0.65+i*0.1,0.03,8,50);
    const torusMat=new THREE.MeshBasicMaterial({color:i%2===0?0x88ddff:0xffffff,transparent:true,opacity:0.7});
    const torus=new THREE.Mesh(torusGeo,torusMat);
    torus.rotation.x=Math.PI/2+i*0.5;
    torus.rotation.y=i*1.2;
    rasenganGroup.add(torus);
    swirls.push(torus);
  }
  const particleCount=200;
  const positions=new Float32Array(particleCount*3);
  for(let i=0;i<particleCount;i++){
    const angle=(i/particleCount)*Math.PI*2;
    const radius=0.8+Math.random()*0.4;
    positions[i*3]=Math.cos(angle)*radius;
    positions[i*3+1]=(Math.random()-0.5)*0.6;
    positions[i*3+2]=Math.sin(angle)*radius;
  }
  const particleGeo=new THREE.BufferGeometry();
  particleGeo.setAttribute('position',new THREE.BufferAttribute(positions,3));
  const particleMat=new THREE.PointsMaterial({color:0xaaeeff,size:0.05,transparent:true,opacity:0.8});
  particles=new THREE.Points(particleGeo,particleMat);
  rasenganGroup.add(particles);
  rasenganGroup.scale.set(0,0,0);
}

const CONN=[[0,1],[1,2],[2,3],[3,4],[0,5],[5,6],[6,7],[7,8],[5,9],[9,10],[10,11],[11,12],[9,13],[13,14],[14,15],[15,16],[13,17],[17,18],[18,19],[19,20],[0,17]];
function drawHand(lm,intensity){
  ctx.save();ctx.globalAlpha=0.6+intensity*0.3;
  for(const[a,b]of CONN){
    const ax=(1-lm[a].x)*W,ay=lm[a].y*H,bx=(1-lm[b].x)*W,by=lm[b].y*H;
    ctx.strokeStyle=`rgba(${100+intensity*100},200,255,0.7)`;
    ctx.lineWidth=2;ctx.shadowBlur=8*intensity;ctx.shadowColor='#2299ff';
