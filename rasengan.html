<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Rasengan ⚡</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { background: #000; overflow: hidden; font-family: 'Courier New', monospace; color: #fff; touch-action: none; }
#container { position: relative; width: 100vw; height: 100vh; }
#video { position: absolute; width: 100%; height: 100%; object-fit: cover; transform: scaleX(-1); opacity: 1; }
#three-canvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; }
#canvas2d { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; }
#ui { position: absolute; top: 16px; left: 16px; z-index: 10; background: rgba(0,20,40,0.7); border: 1px solid rgba(100,200,255,0.4); border-radius: 10px; padding: 10px 14px; font-size: 11px; line-height: 1.8; }
#ui .label { color: #66ccff; } #ui .val { color: #fff; font-weight: bold; }
#status { position: absolute; bottom: 30px; left: 50%; transform: translateX(-50%); font-size: 13px; color: rgba(150,220,255,0.9); z-index: 10; background: rgba(0,20,40,0.6); padding: 8px 18px; border-radius: 20px; white-space: nowrap; }
#loading { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; background: linear-gradient(180deg,#001020,#000); z-index: 100; gap: 16px; }
#loading h1 { font-size: 30px; color: #66ccff; letter-spacing: 4px; text-shadow: 0 0 30px #2299ff; }
#loading p { color: #335577; font-size: 13px; }
.spinner { width: 40px; height: 40px; border: 3px solid #112233; border-top-color: #2299ff; border-radius: 50%; animation: spin 0.8s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
#startBtn { padding: 16px 36px; background: rgba(20,100,200,0.3); border: 2px solid #2299ff; color: #aaddff; font-family: inherit; font-size: 16px; border-radius: 30px; cursor: pointer; letter-spacing: 2px; box-shadow: 0 0 20px rgba(20,150,255,0.4); }
</style>
</head>
<body>
<div id="container">
  <video id="video" playsinline muted></video>
  <canvas id="three-canvas"></canvas>
  <canvas id="canvas2d"></canvas>
  <div id="ui">
    <div><span class="label">Tangan: </span><span class="val" id="handCount">0</span></div>
    <div><span class="label">Chakra: </span><span class="val" id="power">0%</span></div>
    <div><span class="label">FPS: </span><span class="val" id="fps">0</span></div>
  </div>
  <div id="status">Buka telapak tangan ke kamera 💉</div>
</div>
<div id="loading">
  <h1>💉 RASENGAN 💉</h1>
  <p id="loadText">Mengumpulkan chakra...</p>
  <div class="spinner" id="spinner"></div>
  <button id="startBtn" style="display:none" onclick="startApp()">💉 Bentuk Rasengan</button>
</div>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands@0.4.1646424915/hands.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils@0.3.1640029074/camera_utils.js"></script>
<script>
const video=document.getElementById('video'),canvas2d=document.getElementById('canvas2d'),ctx=canvas2d.getContext('2d'),loading=document.getElementById('loading'),spinner=document.getElementById('spinner'),startBtn=document.getElementById('startBtn'),loadText=document.getElementById('loadText');
let W,H;
function resize(){W=canvas2d.width=window.innerWidth;H=canvas2d.height=window.innerHeight;if(renderer){renderer.setSize(W,H);camera.aspect=W/H;camera.updateProjectionMatrix();}}
let handLandmarks=[],hands,power=0;
let scene,camera,renderer,rasenganGroup,coreSphere,glowSphere,spiralBlades=[],particleSystems=[],innerRings=[];
function initThree(){
  scene=new THREE.Scene();
  camera=new THREE.PerspectiveCamera(50,window.innerWidth/window.innerHeight,0.1,1000);
  camera.position.z=5;
  renderer=new THREE.WebGLRenderer({canvas:document.getElementById('three-canvas'),alpha:true,antialias:true});
  renderer.setSize(window.innerWidth,window.innerHeight);
  renderer.setPixelRatio(Math.min(window.devicePixelRatio,2));
  rasenganGroup=new THREE.Group();scene.add(rasenganGroup);
  coreSphere=new THREE.Mesh(new THREE.SphereGeometry(0.35,32,32),new THREE.MeshBasicMaterial({color:0xeeffff,transparent:true,opacity:1}));
  rasenganGroup.add(coreSphere);
  glowSphere=new THREE.Mesh(new THREE.SphereGeometry(0.5,32,32),new THREE.MeshBasicMaterial({color:0x44aaff,transparent:true,opacity:0.5,side:THREE.BackSide}));
  rasenganGroup.add(glowSphere);
  rasenganGroup.add(new THREE.Mesh(new THREE.SphereGeometry(0.85,32,32),new THREE.MeshBasicMaterial({color:0x2266cc,transparent:true,opacity:0.15,side:THREE.BackSide})));
  for(let i=0;i<4;i++){
    const sh=new THREE.Shape();sh.moveTo(0,0);sh.quadraticCurveTo(0.4,0.15,0.75,0.05);sh.quadraticCurveTo(0.85,0,0.75,-0.05);sh.quadraticCurveTo(0.4,-0.15,0,0);
    const b=new THREE.Mesh(new THREE.ShapeGeometry(sh,12),new THREE.MeshBasicMaterial({color:i%2===0?0x99ddff:0xffffff,transparent:true,opacity:0.55,side:THREE.DoubleSide}));
    b.rotation.z=(i/4)*Math.PI*2;b.userData.speed=0.12+i*0.02;rasenganGroup.add(b);spiralBlades.push(b);
  }
  for(let i=0;i<4;i++){
    const sh=new THREE.Shape();sh.moveTo(0,0);sh.quadraticCurveTo(0.25,0.1,0.5,0.03);sh.quadraticCurveTo(0.58,0,0.5,-0.03);sh.quadraticCurveTo(0.25,-0.1,0,0);
    const b=new THREE.Mesh(new THREE.ShapeGeometry(sh,12),new THREE.MeshBasicMaterial({color:0xccf2ff,transparent:true,opacity:0.5,side:THREE.DoubleSide}));
    b.rotation.z=(i/4)*Math.PI*2+0.5;b.userData.speed=-0.18-i*0.015;rasenganGroup.add(b);spiralBlades.push(b);
  }
  for(let i=0;i<3;i++){
    const t=new THREE.Mesh(new THREE.TorusGeometry(0.7+i*0.06,0.015,6,60),new THREE.MeshBasicMaterial({color:i===1?0xffffff:0x77ccff,transparent:true,opacity:0.6}));
    t.rotation.x=(i/3)*Math.PI;t.rotation.y=(i/3)*Math.PI*0.7;t.userData.speed=0.02+i*0.015;rasenganGroup.add(t);innerRings.push(t);
  }
  const pc=400,pos=new Float32Array(pc*3),seeds=[];
  for(let i=0;i<pc;i++){const a=Math.random()*Math.PI*2,r=0.5+Math.random()*0.6,h=(Math.random()-.5)*0.4;pos[i*3]=Math.cos(a)*r;pos[i*3+1]=h;pos[i*3+2]=Math.sin(a)*r;seeds.push({angle:a,radius:r,height:h,speed:0.02+Math.random()*0.04});}
  const pg=new THREE.BufferGeometry();pg.setAttribute('position',new THREE.BufferAttribute(pos,3));
  const p=new THREE.Points(pg,new THREE.PointsMaterial({color:0xbbe8ff,size:0.035,transparent:true,opacity:0.85}));p.userData.seeds=seeds;rasenganGroup.add(p);particleSystems.push(p);
  const sc=80,sp=new Float32Array(sc*3),ss=[];
  for(let i=0;i<sc;i++){const a=Math.random()*Math.PI*2,r=0.9+Math.random()*0.4,h=(Math.random()-.5)*0.8;sp[i*3]=Math.cos(a)*r;sp[i*3+1]=h;sp[i*3+2]=Math.sin(a)*r;ss.push({angle:a,radius:r,height:h,speed:0.005+Math.random()*0.015});}
  const sg=new THREE.BufferGeometry();sg.setAttribute('position',new THREE.BufferAttribute(sp,3));
  const s=new THREE.Points(sg,new THREE.PointsMaterial({color:0x66bbff,size:0.06,transparent:true,opacity:0.5}));s.userData.seeds=ss;rasenganGroup.add(s);particleSystems.push(s);
  rasenganGroup.scale.set(0,0,0);
}
function updateParticles(t){
  for(const sys of particleSystems){
    const pos=sys.geometry.attributes.position.array,seeds=sys.userData.seeds;
    for(let i=0;i<seeds.length;i++){const s=seeds[i];s.angle+=s.speed;const r=s.radius+Math.sin(t*2+i)*0.03;pos[i*3]=Math.cos(s.angle)*r;pos[i*3+1]=s.height+Math.sin(t*1.5+i*0.3)*0.05;pos[i*3+2]=Math.sin(s.angle)*r;}
    sys.geometry.attributes.position.needsUpdate=true;
  }
}
const CONN=[[0,1],[1,2],[2,3],[3,4],[0,5],[5,6],[6,7],[7,8],[5,9],[9,10],[10,11],[11,12],[9,13],[13,14],[14,15],[15,16],[13,17],[17,18],[18,19],[19,20],[0,17]];
function drawHand(lm,intensity){
  ctx.save();ctx.globalAlpha=0.6+intensity*0.3;
  for(const[a,b]of CONN){const ax=(1-lm[a].x)*W,ay=lm[a].y*H,bx=(1-lm[b].x)*W,by=lm[b].y*H;ctx.strokeStyle=`rgba(${100+intensity*100},200,255,0.7)`;ctx.lineWidth=2;ctx.shadowBlur=8*intensity;ctx.shadowColor='#2299ff';ctx.beginPath();ctx.moveTo(ax,ay);ctx.lineTo(bx,by);ctx.stroke();}
  for(const pt of lm){const x=(1-pt.x)*W,y=pt.y*H;ctx.beginPath();ctx.arc(x,y,4,0,Math.PI*2);ctx.fillStyle='rgba(200,230,255,0.9)';ctx.shadowBlur=10;ctx.shadowColor='#66ccff';ctx.fill();}
  ctx.restore();
}
function initMP(){
  hands=new Hands({locateFile:f=>`https://cdn.jsdelivr.net/npm/@mediapipe/hands@0.4.1646424915/${f}`});
  hands.setOptions({maxNumHands:1,modelComplexity:0,minDetectionConfidence:.6,minTrackingConfidence:.5});
  hands.onResults(r=>{handLandmarks=r.multiHandLandmarks||[];document.getElementById('handCount').textContent=handLandmarks.length;});
  spinner.style.display='none';startBtn.style.display='block';loadText.textContent='Chakra siap! Tekan tombol.';
}
async function startApp(){
  startBtn.disabled=true;startBtn.textContent='Menghubungkan...';
  try{
    const s=await navigator.mediaDevices.getUserMedia({video:{facingMode:'user',width:{ideal:640},height:{ideal:480}}});
    video.srcObject=s;await video.play();
    new Camera(video,{onFrame:async()=>{await hands.send({image:video});},width:640,height:480}).start();
    loading.style.display='none';initThree();resize();window.addEventListener('resize',resize);loop();
  }catch(e){startBtn.textContent='❌ Izin Ditolak - Tap Lagi';startBtn.disabled=false;}
}
let lt=0,fc=0,ft=0,t=0;
function loop(ts=0){
  requestAnimationFrame(loop);
  const dt=ts-lt;lt=ts;fc++;ft+=dt;
  if(ft>500){document.getElementById('fps').textContent=Math.round(fc/ft*1000);fc=0;ft=0;}
  ctx.clearRect(0,0,W,H);t+=0.05;
  if(handLandmarks.length>0){
    power=Math.min(1,power+0.02);
    document.getElementById('status').textContent='💉 RASENGAN TERBENTUK!';
    const lm=handLandmarks[0];drawHand(lm,power);
    const pts=[0,1,5,9,13,17];let px=0,py=0;
    for(const i of pts){px+=(1-lm[i].x);py+=lm[i].y;}
    px/=pts.length;py/=pts.length;
    const worldPos=new THREE.Vector3((px*2-1)*camera.aspect*2.5,-(py*2-1)*2.5,0);
    rasenganGroup.position.copy(worldPos);
    rasenganGroup.scale.setScalar(power*0.9*(1+Math.sin(t*4)*0.04*power));
    spiralBlades.forEach(b=>b.rotation.z+=b.userData.speed*(0.5+power));
    innerRings.forEach((ring,i)=>{if(i===0)ring.rotation.x+=ring.userData.speed*(1+power);else if(i===1)ring.rotation.y+=ring.userData.speed*(1+power);else ring.rotation.z+=ring.userData.speed*(1+power);});
    updateParticles(t);
    coreSphere.material.opacity=0.85+Math.sin(t*6)*0.15;
    glowSphere.material.opacity=0.4+Math.sin(t*3)*0.15;
    if(power>0.9){ctx.fillStyle=`rgba(150,200,255,${0.04*Math.abs(Math.sin(t*5))})`;ctx.fillRect(0,0,W,H);}
  } else {
    power=Math.max(0,power-0.05);
    document.getElementById('status').textContent='Buka telapak tangan ke kamera 💉';
    if(rasenganGroup)rasenganGroup.scale.setScalar(power*0.9);
    if(power>0){spiralBlades.forEach(b=>b.rotation.z+=b.userData.speed*0.3);updateParticles(t);}
  }
  document.getElementById('power').textContent=Math.round(power*100)+'%';
  renderer.render(scene,camera);
}
setTimeout(initMP,300);
</script>
</body>
</html>
