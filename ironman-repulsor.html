<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no"/>
<title>Iron Man Repulsor - AR Effect</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#000;overflow:hidden;font-family:'Segoe UI',sans-serif;touch-action:none}
#c{position:fixed;top:0;left:0;width:100vw;height:100vh;z-index:10}
video{position:fixed;top:0;left:0;width:100vw;height:100vh;object-fit:cover;transform:scaleX(-1);z-index:1}

/* HUD overlay */
.hud{position:fixed;z-index:20;pointer-events:none}
.hud-top{top:0;left:0;right:0;padding:16px;display:flex;justify-content:space-between;align-items:flex-start}
.hud-bottom{bottom:0;left:0;right:0;padding:20px;display:flex;flex-direction:column;align-items:center;gap:10px}

.arc-reactor{width:48px;height:48px;border-radius:50%;background:radial-gradient(circle,#7DF9FF,#00BFFF,#0066CC);box-shadow:0 0 20px #7DF9FF,0 0 40px #00BFFF;animation:pulse 1.5s ease-in-out infinite}
@keyframes pulse{0%,100%{box-shadow:0 0 20px #7DF9FF,0 0 40px #00BFFF}50%{box-shadow:0 0 40px #7DF9FF,0 0 80px #00BFFF,0 0 120px #0044AA}}

.hud-text{color:#7DF9FF;font-size:11px;letter-spacing:2px;text-transform:uppercase;text-shadow:0 0 10px #00BFFF;font-weight:600}
.hud-title{color:#7DF9FF;font-size:18px;font-weight:800;letter-spacing:4px;text-shadow:0 0 20px #00BFFF}
.power-bar-wrap{width:200px}
.power-label{color:#7DF9FF;font-size:10px;letter-spacing:2px;margin-bottom:4px;text-align:center}
.power-bar{height:4px;background:#003355;border-radius:2px;overflow:hidden}
.power-fill{height:100%;background:linear-gradient(90deg,#00BFFF,#7DF9FF);border-radius:2px;transition:width 0.1s;box-shadow:0 0 8px #00BFFF}

.corner{position:fixed;z-index:20;pointer-events:none;width:24px;height:24px;border-color:#7DF9FF44}
.tl{top:12px;left:12px;border-top:2px solid;border-left:2px solid}
.tr{top:12px;right:12px;border-top:2px solid;border-right:2px solid}
.bl{bottom:12px;left:12px;border-bottom:2px solid;border-left:2px solid}
.br{bottom:12px;right:12px;border-bottom:2px solid;border-right:2px solid}

/* Scanline */
.scanline{position:fixed;top:0;left:0;right:0;bottom:0;z-index:15;pointer-events:none;background:repeating-linear-gradient(0deg,transparent,transparent 2px,rgba(0,191,255,0.015) 2px,rgba(0,191,255,0.015) 4px)}

/* Start screen */
.start-screen{position:fixed;inset:0;z-index:100;background:radial-gradient(ellipse at center,#001833 0%,#000 100%);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:24px}
.start-logo{width:120px;height:120px;border-radius:50%;background:radial-gradient(circle,#7DF9FF 0%,#00BFFF 40%,#003366 70%,#000 100%);box-shadow:0 0 60px #00BFFF,0 0 120px #0066CC;animation:pulse 2s ease-in-out infinite;display:flex;align-items:center;justify-content:center;font-size:48px}
.start-title{color:#7DF9FF;font-size:28px;font-weight:900;letter-spacing:6px;text-shadow:0 0 30px #00BFFF}
.start-sub{color:#4499BB;font-size:13px;letter-spacing:3px;text-align:center}
.start-btn{background:linear-gradient(135deg,#003366,#0066CC);border:2px solid #7DF9FF;border-radius:50px;padding:16px 48px;color:#7DF9FF;font-size:15px;font-weight:700;letter-spacing:3px;cursor:pointer;box-shadow:0 0 30px #00BFFF44;transition:all 0.3s;font-family:inherit}
.start-btn:hover{box-shadow:0 0 60px #00BFFF;transform:scale(1.05)}
.start-hint{color:#336688;font-size:11px;letter-spacing:2px;text-align:center;line-height:1.8}

.status-pill{background:#001833CC;border:1px solid #7DF9FF44;border-radius:20px;padding:6px 16px;color:#7DF9FF;font-size:11px;letter-spacing:2px}
</style>
</head>
<body>

<!-- Start Screen -->
<div class="start-screen" id="startScreen">
  <div class="start-logo">🤖</div>
  <div class="start-title">MARK L</div>
  <div class="start-sub">REPULSOR TECHNOLOGY • STARK INDUSTRIES</div>
  <button class="start-btn" onclick="startAR()">⚡ ACTIVATE SUIT</button>
  <div class="start-hint">
    Arahkan kamera ke tangan kamu<br>
    Rentangkan jari untuk aktifkan repulsor<br>
    Kepalkan untuk blast! 💥
  </div>
</div>

<!-- AR Canvas -->
<video id="vid" autoplay playsinline muted></video>
<canvas id="c"></canvas>
<div class="scanline"></div>

<!-- Corners -->
<div class="corner tl"></div>
<div class="corner tr"></div>
<div class="corner bl"></div>
<div class="corner br"></div>

<!-- HUD -->
<div class="hud hud-top">
  <div>
    <div class="hud-title">STARK TECH</div>
    <div class="hud-text" id="statusText">INITIALIZING...</div>
  </div>
  <div class="arc-reactor"></div>
</div>

<div class="hud hud-bottom">
  <div class="status-pill" id="detectionStatus">🔍 Scanning...</div>
  <div class="power-bar-wrap">
    <div class="power-label">REPULSOR POWER</div>
    <div class="power-bar"><div class="power-fill" id="powerFill" style="width:0%"></div></div>
  </div>
  <div class="hud-text">@Dodiprediksi</div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/mediapipe/0.4.1646424915/hands.min.js" 
  onerror="loadFallback()"></script>

<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
const video = document.getElementById('vid');

let W, H;
let hands = [];
let particles = [];
let blasts = [];
let rings = [];
let power = 0;
let frame = 0;
let mpHands = null;
let fallbackMode = false;
let touchPoints = [];

function resize() {
  W = canvas.width = window.innerWidth;
  H = canvas.height = window.innerHeight;
}
resize();
window.addEventListener('resize', resize);

// ===== MEDIAPIPE SETUP =====
async function startAR() {
  document.getElementById('startScreen').style.display = 'none';
  
  try {
    const stream = await navigator.mediaDevices.getUserMedia({
      video: { facingMode: 'user', width: { ideal: 1280 }, height: { ideal: 720 } }
    });
    video.srcObject = stream;
    await video.play();
    
    if (typeof Hands !== 'undefined') {
      setupMediaPipe();
    } else {
      loadFallback();
    }
  } catch(e) {
    loadFallback();
  }
  
  requestAnimationFrame(loop);
}

function setupMediaPipe() {
  try {
    mpHands = new Hands({ locateFile: f => `https://cdnjs.cloudflare.com/ajax/libs/mediapipe/0.4.1646424915/${f}` });
    mpHands.setOptions({ maxNumHands: 2, modelComplexity: 0, minDetectionConfidence: 0.6, minTrackingConfidence: 0.5 });
    mpHands.onResults(onResults);

    const camera = new Camera(video, {
      onFrame: async () => { if(mpHands) await mpHands.send({ image: video }); },
      width: 1280, height: 720
    });
    camera.start();
    document.getElementById('statusText').textContent = 'SYSTEMS ONLINE';
  } catch(e) { loadFallback(); }
}

function loadFallback() {
  fallbackMode = true;
  document.getElementById('statusText').textContent = 'TOUCH MODE ACTIVE';
  document.getElementById('detectionStatus').textContent = '👆 Touch Screen';
  setupTouchFallback();
}

function setupTouchFallback() {
  canvas.addEventListener('touchstart', e => {
    e.preventDefault();
    touchPoints = Array.from(e.touches).map(t => ({ x: W - t.clientX, y: t.clientY, id: t.identifier }));
    touchPoints.forEach(p => triggerBlast(p.x, p.y));
  }, { passive: false });

  canvas.addEventListener('touchmove', e => {
    e.preventDefault();
    touchPoints = Array.from(e.touches).map(t => ({ x: W - t.clientX, y: t.clientY, id: t.identifier }));
  }, { passive: false });

  canvas.addEventListener('touchend', e => {
    e.preventDefault();
    touchPoints = Array.from(e.touches).map(t => ({ x: W - t.clientX, y: t.clientY, id: t.identifier }));
  }, { passive: false });

  canvas.addEventListener('click', e => {
    triggerBlast(W - e.clientX, e.clientY);
  });
}

function onResults(results) {
  hands = results.multiHandLandmarks || [];
  if (hands.length > 0) {
    document.getElementById('detectionStatus').textContent = `✋ ${hands.length} Hand${hands.length>1?'s':''} Detected`;
  } else {
    document.getElementById('detectionStatus').textContent = '🔍 Scanning...';
  }
}

// ===== HAND ANALYSIS =====
function getPalmCenter(lm) {
  return { x: (1 - lm[0].x) * W, y: lm[0].y * H };
}

function getFingerTips(lm) {
  return [4, 8, 12, 16, 20].map(i => ({ x: (1 - lm[i].x) * W, y: lm[i].y * H }));
}

function isFingerOpen(lm, tip, base) {
  return lm[tip].y < lm[base].y;
}

function countOpenFingers(lm) {
  let count = 0;
  if ((1-lm[4].x) > (1-lm[3].x)) count++; // thumb
  if (lm[8].y < lm[6].y) count++;
  if (lm[12].y < lm[10].y) count++;
  if (lm[16].y < lm[14].y) count++;
  if (lm[20].y < lm[18].y) count++;
  return count;
}

// ===== EFFECTS =====
function triggerBlast(x, y) {
  // Main blast ring
  blasts.push({ x, y, r: 0, maxR: 200, life: 1, speed: 8 });
  blasts.push({ x, y, r: 0, maxR: 350, life: 1, speed: 5 });

  // Shockwave particles
  for (let i = 0; i < 60; i++) {
    const angle = (Math.PI * 2 / 60) * i;
    const speed = 8 + Math.random() * 12;
    particles.push({
      x, y,
      vx: Math.cos(angle) * speed,
      vy: Math.sin(angle) * speed,
      life: 1,
      size: 2 + Math.random() * 4,
      type: 'blast',
      color: Math.random() > 0.5 ? '#7DF9FF' : '#FFFFFF'
    });
  }

  // Energy bolts
  for (let i = 0; i < 12; i++) {
    const angle = Math.random() * Math.PI * 2;
    const dist = 50 + Math.random() * 150;
    particles.push({
      x, y,
      tx: x + Math.cos(angle) * dist,
      ty: y + Math.sin(angle) * dist,
      life: 1, type: 'bolt',
      color: '#7DF9FF'
    });
  }
}

function spawnRepulsorGlow(x, y, intensity) {
  if (Math.random() < 0.4) {
    particles.push({
      x: x + (Math.random()-0.5)*20,
      y: y + (Math.random()-0.5)*20,
      vx: (Math.random()-0.5)*3,
      vy: -Math.random()*4-2,
      life: 1,
      size: 3 + Math.random()*6,
      type: 'glow',
      color: Math.random() > 0.3 ? '#7DF9FF' : '#FFFFFF'
    });
  }

  // Energy ring
  if (Math.random() < 0.1) {
    rings.push({ x, y, r: 10, maxR: 80 + intensity*40, life: 1 });
  }
}

// ===== DRAW FUNCTIONS =====
function drawRepulsor(x, y, power, label) {
  ctx.save();

  // Outer ring
  ctx.beginPath();
  ctx.arc(x, y, 35 + power*15, 0, Math.PI*2);
  ctx.strokeStyle = `rgba(125,249,255,${0.3 + power*0.4})`;
  ctx.lineWidth = 2;
  ctx.shadowBlur = 20;
  ctx.shadowColor = '#00BFFF';
  ctx.stroke();

  // Inner ring
  ctx.beginPath();
  ctx.arc(x, y, 20 + power*8, 0, Math.PI*2);
  ctx.strokeStyle = `rgba(125,249,255,${0.6 + power*0.4})`;
  ctx.lineWidth = 3;
  ctx.shadowBlur = 30;
  ctx.stroke();

  // Core glow
  const grad = ctx.createRadialGradient(x, y, 0, x, y, 25 + power*20);
  grad.addColorStop(0, `rgba(255,255,255,${0.8 + power*0.2})`);
  grad.addColorStop(0.3, `rgba(125,249,255,${0.6 + power*0.3})`);
  grad.addColorStop(0.7, `rgba(0,191,255,${0.3 + power*0.3})`);
  grad.addColorStop(1, 'rgba(0,0,100,0)');
  ctx.beginPath();
  ctx.arc(x, y, 25 + power*20, 0, Math.PI*2);
  ctx.fillStyle = grad;
  ctx.shadowBlur = 40 + power*40;
  ctx.shadowColor = '#00BFFF';
  ctx.fill();

  // Rotating hex segments
  const segs = 6;
  for (let i = 0; i < segs; i++) {
    const angle = (Math.PI*2/segs)*i + frame*0.05;
    const r1 = 28 + power*10;
    const r2 = 38 + power*15;
    ctx.beginPath();
    ctx.moveTo(x + Math.cos(angle)*r1, y + Math.sin(angle)*r1);
    ctx.lineTo(x + Math.cos(angle+0.3)*r2, y + Math.sin(angle+0.3)*r2);
    ctx.strokeStyle = `rgba(125,249,255,${0.4 + power*0.4})`;
    ctx.lineWidth = 2;
    ctx.shadowBlur = 15;
    ctx.stroke();
  }

  // Label
  if (label) {
    ctx.fillStyle = `rgba(125,249,255,${0.8})`;
    ctx.font = 'bold 11px Segoe UI';
    ctx.letterSpacing = '2px';
    ctx.textAlign = 'center';
    ctx.shadowBlur = 10;
    ctx.fillText(label, x, y - 50);
  }

  ctx.restore();
}

function drawBlasts() {
  blasts = blasts.filter(b => b.life > 0);
  blasts.forEach(b => {
    b.r += b.speed;
    b.life = 1 - b.r / b.maxR;

    ctx.save();
    ctx.beginPath();
    ctx.arc(b.x, b.y, b.r, 0, Math.PI*2);
    ctx.strokeStyle = `rgba(125,249,255,${b.life * 0.8})`;
    ctx.lineWidth = 3 * b.life;
    ctx.shadowBlur = 30;
    ctx.shadowColor = '#00BFFF';
    ctx.stroke();

    // Second ring slightly offset
    ctx.beginPath();
    ctx.arc(b.x, b.y, b.r * 0.85, 0, Math.PI*2);
    ctx.strokeStyle = `rgba(255,255,255,${b.life * 0.4})`;
    ctx.lineWidth = 1;
    ctx.stroke();
    ctx.restore();
  });
}

function drawRings() {
  rings = rings.filter(r => r.life > 0);
  rings.forEach(r => {
    r.r += (r.maxR - r.r) * 0.12;
    r.life -= 0.04;

    ctx.save();
    ctx.beginPath();
    ctx.arc(r.x, r.y, r.r, 0, Math.PI*2);
    ctx.strokeStyle = `rgba(125,249,255,${r.life * 0.6})`;
    ctx.lineWidth = 2;
    ctx.shadowBlur = 15;
    ctx.shadowColor = '#00BFFF';
    ctx.stroke();
    ctx.restore();
  });
}

function drawParticles() {
  particles = particles.filter(p => p.life > 0);
  particles.forEach(p => {
    if (p.type === 'blast') {
      p.x += p.vx;
      p.y += p.vy;
      p.vx *= 0.92;
      p.vy *= 0.92;
      p.life -= 0.025;

      ctx.save();
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.size * p.life, 0, Math.PI*2);
      ctx.fillStyle = p.color === '#7DF9FF'
        ? `rgba(125,249,255,${p.life})`
        : `rgba(255,255,255,${p.life})`;
      ctx.shadowBlur = 15;
      ctx.shadowColor = '#00BFFF';
      ctx.fill();
      ctx.restore();

    } else if (p.type === 'glow') {
      p.x += p.vx;
      p.y += p.vy;
      p.vy *= 0.95;
      p.life -= 0.03;

      ctx.save();
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.size * p.life, 0, Math.PI*2);
      ctx.fillStyle = `rgba(125,249,255,${p.life * 0.7})`;
      ctx.shadowBlur = 20;
      ctx.shadowColor = '#00BFFF';
      ctx.fill();
      ctx.restore();

    } else if (p.type === 'bolt') {
      p.life -= 0.06;
      const prog = 1 - p.life;
      const cx = p.x + (p.tx - p.x) * prog;
      const cy = p.y + (p.ty - p.y) * prog;

      ctx.save();
      ctx.beginPath();
      ctx.moveTo(p.x, p.y);
      ctx.lineTo(cx, cy);
      ctx.strokeStyle = `rgba(125,249,255,${p.life})`;
      ctx.lineWidth = 2 * p.life;
      ctx.shadowBlur = 20;
      ctx.shadowColor = '#7DF9FF';
      ctx.stroke();
      ctx.restore();
    }
  });
}

function drawHUDLines(x, y) {
  ctx.save();
  ctx.strokeStyle = 'rgba(125,249,255,0.3)';
  ctx.lineWidth = 1;
  ctx.setLineDash([4, 8]);

  // Crosshair lines
  ctx.beginPath();
  ctx.moveTo(x - 60, y); ctx.lineTo(x - 45, y);
  ctx.moveTo(x + 45, y); ctx.lineTo(x + 60, y);
  ctx.moveTo(x, y - 60); ctx.lineTo(x, y - 45);
  ctx.moveTo(x, y + 45); ctx.lineTo(x, y + 60);
  ctx.stroke();
  ctx.restore();
}

function drawSkeleton(lm) {
  const connections = [
    [0,1],[1,2],[2,3],[3,4],
    [0,5],[5,6],[6,7],[7,8],
    [0,9],[9,10],[10,11],[11,12],
    [0,13],[13,14],[14,15],[15,16],
    [0,17],[17,18],[18,19],[19,20],
    [5,9],[9,13],[13,17]
  ];

  ctx.save();
  connections.forEach(([a,b]) => {
    const ax = (1-lm[a].x)*W, ay = lm[a].y*H;
    const bx = (1-lm[b].x)*W, by = lm[b].y*H;
    ctx.beginPath();
    ctx.moveTo(ax, ay);
    ctx.lineTo(bx, by);
    ctx.strokeStyle = 'rgba(125,249,255,0.25)';
    ctx.lineWidth = 1.5;
    ctx.shadowBlur = 8;
    ctx.shadowColor = '#00BFFF';
    ctx.stroke();
  });

  // Joint dots
  lm.forEach((p, i) => {
    const x = (1-p.x)*W, y = p.y*H;
    ctx.beginPath();
    ctx.arc(x, y, i === 0 ? 5 : 3, 0, Math.PI*2);
    ctx.fillStyle = 'rgba(125,249,255,0.5)';
    ctx.shadowBlur = 10;
    ctx.fill();
  });
  ctx.restore();
}

// ===== MAIN LOOP =====
function loop() {
  frame++;
  ctx.clearRect(0, 0, W, H);

  if (fallbackMode) {
    // Touch fallback mode
    touchPoints.forEach(p => {
      power = Math.min(power + 0.05, 1);
      spawnRepulsorGlow(p.x, p.y, power);
      drawRepulsor(p.x, p.y, power, 'REPULSOR');
      drawHUDLines(p.x, p.y);
    });

    if (touchPoints.length === 0) {
      power = Math.max(power - 0.03, 0);
    }

  } else {
    // MediaPipe mode
    let totalPower = 0;

    hands.forEach((lm, hi) => {
      drawSkeleton(lm);

      const palm = getPalmCenter(lm);
      const tips = getFingerTips(lm);
      const openCount = countOpenFingers(lm);
      const handPower = openCount / 5;

      totalPower += handPower;

      // Repulsor on palm
      spawnRepulsorGlow(palm.x, palm.y, handPower);
      drawRepulsor(palm.x, palm.y, handPower, openCount >= 4 ? '⚡ CHARGED' : 'CHARGING...');
      drawHUDLines(palm.x, palm.y);

      // Finger tip effects when fully open
      if (openCount >= 4) {
        tips.forEach(tip => {
          if (Math.random() < 0.3) {
            particles.push({
              x: tip.x + (Math.random()-0.5)*10,
              y: tip.y + (Math.random()-0.5)*10,
              vx: (Math.random()-0.5)*2,
              vy: -Math.random()*3,
              life: 1, size: 2+Math.random()*3, type:'glow'
            });
          }
        });
      }

      // Fist = BLAST!
      if (openCount === 0 && frame % 8 === 0) {
        triggerBlast(palm.x, palm.y);
      }
    });

    power = hands.length > 0 ? Math.min(totalPower / hands.length, 1) : Math.max(power - 0.02, 0);
  }

  // Draw effects
  drawRings();
  drawBlasts();
  drawParticles();

  // Update HUD
  document.getElementById('powerFill').style.width = (power * 100) + '%';

  requestAnimationFrame(loop);
}
</script>
</body>
</html>
