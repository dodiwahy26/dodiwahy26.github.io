<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Rasenshuriken ⚡🌀</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { background: #000; overflow: hidden; font-family: 'Courier New', monospace; color: #fff; touch-action: none; }
#container { position: relative; width: 100vw; height: 100vh; }
#video { position: absolute; width: 100%; height: 100%; object-fit: cover; transform: scaleX(-1); opacity: 1; }
#three-canvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; }
#canvas2d { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; }
#ui { position: absolute; top: 16px; left: 16px; z-index: 10; background: rgba(0,10,30,0.8); border: 1px solid rgba(150,100,255,0.5); border-radius: 10px; padding: 10px 14px; font-size: 11px; line-height: 1.8; }
#ui .label { color: #aa88ff; } #ui .val { color: #fff; font-weight: bold; }
#status { position: absolute; bottom: 30px; left: 50%; transform: translateX(-50%); font-size: 13px; color: rgba(200,180,255,0.9); z-index: 10; background: rgba(0,10,30,0.7); padding: 8px 18px; border-radius: 20px; white-space: nowrap; }
#loading { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; background: linear-gradient(180deg,#050010,#000); z-index: 100; gap: 16px; }
#loading h1 { font-size: 26px; background: linear-gradient(90deg,#66ccff,#aa66ff,#ff6699,#ffcc00); -webkit-background-clip:text; -webkit-text-fill-color:transparent; letter-spacing: 3px; }
#loading p { color: #445566; font-size: 13px; }
.spinner { width: 40px; height: 40px; border: 3px solid #111122; border-top-color: #aa66ff; border-radius: 50%; animation: spin 0.8s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
#startBtn { padding: 16px 36px; background: rgba(100,50,200,0.3); border: 2px solid #aa66ff; color: #ccaaff; font-family: inherit; font-size: 16px; border-radius: 30px; cursor: pointer; letter-spacing: 2px; box-shadow: 0 0 20px rgba(150,80,255,0.4); }
#chakraBar { position: absolute; bottom: 70px; left: 50%; transform: translateX(-50%); width: 200px; height: 8px; background: rgba(255,255,255,0.1); border-radius: 10px; z-index: 10; overflow: hidden; }
#chakraFill { height: 100%; width: 0%; border-radius: 10px; transition: width 0.1s; }
</style>
</head>
<body>
<div id="container">
  <video id="video" playsinline muted></video>
  <canvas id="three-canvas"></canvas>
  <canvas id="canvas2d"></canvas>
  <div id="ui">
    <div><span class="label">Tangan: </span><span class="val" id="handCount">0</span></div>
    <div><span class="label">Chakra: </span><span class="val" id="power">0%</span></div>
    <div><span class="label">FPS: </span><span class="val" id="fps">0</span></div>
  </div>
  <div id="chakraBar"><div id="chakraFill"></div></div>
  <div id="status">Kerahkan chakra! Buka telapak tangan ⚡</div>
</div>
<div id="loading">
  <h1>⚡ RASENSHURIKEN 🌀</h1>
  <p id="loadText">Mengumpulkan chakra...</p>
  <div class="spinner" id="spinner"></div>
  <button id="startBtn" style="display:none" onclick="startApp()">⚡ Kerahkan Jurus Ultimate!</button>
</div>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands@0.4.1646424915/hands.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils@0.3.1640029074/camera_utils.js"></script>
<script>
const video=document.getElementById('video'),canvas2d=document.getElementById('canvas2d'),ctx=canvas2d.getContext('2d');
const chakraFill=document.getElementById('chakraFill');
let W,H;
function resize(){W=canvas2d.width=window.innerWidth;H=canvas2d.height=window.innerHeight;if(renderer){renderer.setSize(W,H);cam3.aspect=W/H;cam3.updateProjectionMatrix();}}
let handLandmarks=[],hands,power=0,hue=0,t=0;
let scene,cam3,renderer,rGroup,coreSphere,glowSphere,spiralBlades=[],particleSystems=[],innerRings=[];
let explosionParticles=[],exploding=false,explodeTimer=0;

function initThree(){
  scene=new THREE.Scene();
  cam3=new THREE.PerspectiveCamera(50,window.innerWidth/window.innerHeight,0.1,1000);
  cam3.position.z=5;
  renderer=new THREE.WebGLRenderer({canvas:document.getElementById('three-canvas'),alpha:true,antialias:true});
  renderer.setSize(window.innerWidth,window.innerHeight);
  renderer.setPixelRatio(Math.min(window.devicePixelRatio,2));
  rGroup=new THREE.Group();scene.add(rGroup);

  coreSphere=new THREE.Mesh(new THREE.SphereGeometry(0.3,32,32),new THREE.MeshBasicMaterial({color:0xffffff,transparent:true,opacity:1}));
  rGroup.add(coreSphere);
  glowSphere=new THREE.Mesh(new THREE.SphereGeometry(0.48,32,32),new THREE.MeshBasicMaterial({color:0x8844ff,transparent:true,opacity:0.5,side:THREE.BackSide}));
  rGroup.add(glowSphere);
  rGroup.add(new THREE.Mesh(new THREE.SphereGeometry(0.9,32,32),new THREE.MeshBasicMaterial({color:0x4422cc,transparent:true,opacity:0.1,side:THREE.BackSide})));

  // 4 layer spiral blades
  const bladeColors=[0x66ccff,0xaa66ff,0xff6688,0xffcc00];
  for(let layer=0;layer<4;layer++){
    for(let i=0;i<3;i++){
      const sh=new THREE.Shape();
      sh.moveTo(0,0);sh.quadraticCurveTo(0.35+layer*0.05,0.13,0.72+layer*0.05,0.04);
      sh.quadraticCurveTo(0.82+layer*0.05,0,0.72+layer*0.05,-0.04);
      sh.quadraticCurveTo(0.35+layer*0.05,-0.13,0,0);
      const b=new THREE.Mesh(new THREE.ShapeGeometry(sh,12),
        new THREE.MeshBasicMaterial({color:bladeColors[layer],transparent:true,opacity:0.5,side:THREE.DoubleSide}));
      b.rotation.z=(i/3)*Math.PI*2+layer*0.4;
      b.rotation.x=layer*0.25;
      b.userData.speed=(0.09+layer*0.03)*(i%2===0?1:-1);
      rGroup.add(b);spiralBlades.push(b);
    }
  }

  // 5 orbiting rings
  const ringColors=[0x66ccff,0xaa66ff,0xff6688,0xffcc00,0x44ffaa];
  for(let i=0;i<5;i++){
    const torus=new THREE.Mesh(
      new THREE.TorusGeometry(0.65+i*0.07,0.012,6,60),
      new THREE.MeshBasicMaterial({color:ringColors[i],transparent:true,opacity:0.65})
    );
    torus.rotation.x=(i/5)*Math.PI*1.5;torus.rotation.y=(i/5)*Math.PI;
    torus.userData.speed=0.015+i*0.01;torus.userData.axis=i%3;
    rGroup.add(torus);innerRings.push(torus);
  }

  // Multi-color particles
  const pc=500,pos=new Float32Array(pc*3),colors=new Float32Array(pc*3),seeds=[];
  for(let i=0;i<pc;i++){
    const a=Math.random()*Math.PI*2,r=0.45+Math.random()*0.65,h2=(Math.random()-.5)*0.5;
    pos[i*3]=Math.cos(a)*r;pos[i*3+1]=h2;pos[i*3+2]=Math.sin(a)*r;
    colors[i*3]=0.4+Math.random()*0.5;colors[i*3+1]=0.3+Math.random()*0.5;colors[i*3+2]=0.7+Math.random()*0.3;
    seeds.push({angle:a,radius:r,height:h2,speed:0.025+Math.random()*0.04});
  }
  const pg=new THREE.BufferGeometry();
  pg.setAttribute('position',new THREE.BufferAttribute(pos,3));
  pg.setAttribute('color',new THREE.BufferAttribute(colors,3));
  const p=new THREE.Points(pg,new THREE.PointsMaterial({size:0.03,transparent:true,opacity:0.9,vertexColors:true}));
  p.userData.seeds=seeds;rGroup.add(p);particleSystems.push(p);

  // Outer sparks
  const sc=120,sp=new Float32Array(sc*3),sc2=new Float32Array(sc*3),ss=[];
  for(let i=0;i<sc;i++){
    const a=Math.random()*Math.PI*2,r=1.0+Math.random()*0.5,h2=(Math.random()-.5)*1.0;
    sp[i*3]=Math.cos(a)*r;sp[i*3+1]=h2;sp[i*3+2]=Math.sin(a)*r;
    const c=i%4;
    sc2[i*3]=c===0?0.4:c===1?0.7:c===2?1:1;
    sc2[i*3+1]=c===0?0.8:c===1?0.4:c===2?0.4:0.8;
    sc2[i*3+2]=c===0?1:c===1?1:c===2?0.6:0.2;
    ss.push({angle:a,radius:r,height:h2,speed:0.008+Math.random()*0.012});
  }
  const sg=new THREE.BufferGeometry();
  sg.setAttribute('position',new THREE.BufferAttribute(sp,3));
  sg.setAttribute('color',new THREE.BufferAttribute(sc2,3));
  const s=new THREE.Points(sg,new THREE.PointsMaterial({size:0.055,transparent:true,opacity:0.6,vertexColors:true}));
  s.userData.seeds=ss;rGroup.add(s);particleSystems.push(s);

  rGroup.scale.set(0,0,0);
}

function updateParticles(t){
  for(const sys of particleSystems){
    const pos=sys.geometry.attributes.position.array,seeds=sys.userData.seeds;
    for(let i=0;i<seeds.length;i++){
      const s=seeds[i];s.angle+=s.speed;
      const r=s.radius+Math.sin(t*2+i*0.1)*0.04;
      pos[i*3]=Math.cos(s.angle)*r;
      pos[i*3+1]=s.height+Math.sin(t*1.5+i*0.2)*0.06;
      pos[i*3+2]=Math.sin(s.angle)*r;
    }
    sys.geometry.attributes.position.needsUpdate=true;
  }
}

function lightning(x1,y1,x2,y2,rough,color,alpha){
  if(rough<1.5){
    ctx.save();ctx.globalAlpha=alpha;ctx.strokeStyle=color;
    ctx.lineWidth=rough<0.5?0.8:1.5;ctx.shadowBlur=12;ctx.shadowColor=color;
    ctx.beginPath();ctx.moveTo(x1,y1);ctx.lineTo(x2,y2);ctx.stroke();ctx.restore();return;
  }
  const mx=(x1+x2)/2+(Math.random()-.5)*rough*2.5;
  const my=(y1+y2)/2+(Math.random()-.5)*rough*2.5;
  lightning(x1,y1,mx,my,rough/2,color,alpha);
  lightning(mx,my,x2,y2,rough/2,color,alpha);
}

function drawChidoriLightning(cx,cy,power,hue){
  if(power<0.2) return;
  const radius=(80+power*70)*power;
  const bolts=Math.floor(power*14)+4;
  const colors=[
    `hsla(${hue},100%,70%,0.9)`,
    `hsla(${(hue+60)%360},100%,80%,0.8)`,
    `hsla(${(hue+120)%360},100%,75%,0.7)`,
    `hsla(${(hue+180)%360},100%,70%,0.6)`,
  ];
  for(let i=0;i<bolts;i++){
    const angle=(i/bolts)*Math.PI*2+t*2.5;
    const ex=cx+Math.cos(angle)*radius*(0.8+Math.random()*0.5);
    const ey=cy+Math.sin(angle)*radius*(0.8+Math.random()*0.5);
    const color=colors[i%colors.length];
    lightning(cx,cy,ex,ey,14*power,color,0.8*power);
    if(power>0.5 && Math.random()>0.4){
      lightning(ex,ey,ex+(Math.random()-.5)*60,ey+(Math.random()-.5)*60,6*power,color,0.4*power);
    }
  }
  // Extra sparks
  const sparks=Math.floor(power*10);
  for(let i=0;i<sparks;i++){
    const a=Math.random()*Math.PI*2;
    const r1=radius*0.6,r2=radius*(1.1+Math.random()*0.6);
    lightning(cx+Math.cos(a)*r1,cy+Math.sin(a)*r1,cx+Math.cos(a)*r2,cy+Math.sin(a)*r2,5,colors[i%colors.length],0.5*power);
  }
  // Glow ring
  const grad=ctx.createRadialGradient(cx,cy,radius*0.2,cx,cy,radius*1.2);
  grad.addColorStop(0,`hsla(${hue},100%,80%,0)`);
  grad.addColorStop(0.5,`hsla(${hue},100%,70%,${0.1*power})`);
  grad.addColorStop(1,`hsla(${hue},100%,50%,0)`);
  ctx.beginPath();ctx.arc(cx,cy,radius*1.2,0,Math.PI*2);
  ctx.fillStyle=grad;ctx.fill();
}

// EXPLOSION EFFECT at full power
function drawExplosion(cx,cy,timer){
  const progress=timer/30;
  const radius=progress*Math.min(W,H)*0.5;
  const alpha=1-progress;
  for(let i=0;i<6;i++){
    const a=(i/6)*Math.PI*2+t;
    const r=radius*(0.7+Math.random()*0.4);
    lightning(cx,cy,cx+Math.cos(a)*r,cy+Math.sin(a)*r,20*(1-progress),`hsla(${(hue+i*40)%360},100%,70%,${alpha*0.8})`,alpha);
  }
  ctx.beginPath();ctx.arc(cx,cy,radius*0.8,0,Math.PI*2);
  const eg=ctx.createRadialGradient(cx,cy,0,cx,cy,radius*0.8);
  eg.addColorStop(0,`hsla(${hue},100%,90%,${alpha*0.3})`);
  eg.addColorStop(1,`hsla(${hue},100%,50%,0)`);
  ctx.fillStyle=eg;ctx.fill();
}

const CONN=[[0,1],[1,2],[2,3],[3,4],[0,5],[5,6],[6,7],[7,8],[5,9],[9,10],[10,11],[11,12],[9,13],[13,14],[14,15],[15,16],[13,17],[17,18],[18,19],[19,20],[0,17]];
function drawHand(lm,intensity,hue){
  ctx.save();
  for(const[a,b]of CONN){
    const ax=(1-lm[a].x)*W,ay=lm[a].y*H,bx=(1-lm[b].x)*W,by=lm[b].y*H;
    ctx.globalAlpha=0.5+intensity*0.4;
    ctx.strokeStyle=`hsla(${hue},100%,70%,0.8)`;
    ctx.lineWidth=2;ctx.shadowBlur=10*intensity;ctx.shadowColor=`hsla(${hue},100%,70%,1)`;
    ctx.beginPath();ctx.moveTo(ax,ay);ctx.lineTo(bx,by);ctx.stroke();
  }
  for(const pt of lm){
    const x=(1-pt.x)*W,y=pt.y*H;
    ctx.globalAlpha=0.85;
    ctx.beginPath();ctx.arc(x,y,4,0,Math.PI*2);
    ctx.fillStyle=`hsla(${(hue+60)%360},100%,80%,0.9)`;
    ctx.shadowBlur=12*intensity;ctx.shadowColor=`hsla(${hue},100%,70%,1)`;ctx.fill();
  }
  ctx.restore();
}

function initMP(){
  hands=new Hands({locateFile:f=>`https://cdn.jsdelivr.net/npm/@mediapipe/hands@0.4.1646424915/${f}`});
  hands.setOptions({maxNumHands:1,modelComplexity:0,minDetectionConfidence:.6,minTrackingConfidence:.5});
  hands.onResults(r=>{handLandmarks=r.multiHandLandmarks||[];document.getElementById('handCount').textContent=handLandmarks.length;});
  document.getElementById('spinner').style.display='none';
  document.getElementById('startBtn').style.display='block';
  document.getElementById('loadText').textContent='Chakra siap! Tekan tombol.';
}

async function startApp(){
  document.getElementById('startBtn').disabled=true;
  document.getElementById('startBtn').textContent='Menghubungkan...';
  try{
    const s=await navigator.mediaDevices.getUserMedia({video:{facingMode:'user',width:{ideal:640},height:{ideal:480}}});
    video.srcObject=s;await video.play();
    new Camera(video,{onFrame:async()=>{await hands.send({image:video});},width:640,height:480}).start();
    document.getElementById('loading').style.display='none';
    initThree();resize();window.addEventListener('resize',resize);loop();
  }catch(e){
    document.getElementById('startBtn').textContent='❌ Izin Ditolak - Tap Lagi';
    document.getElementById('startBtn').disabled=false;
  }
}

let lt=0,fc=0,ft=0,palmX=W/2,palmY=H/2;
function loop(ts=0){
  requestAnimationFrame(loop);
  const dt=ts-lt;lt=ts;fc++;ft+=dt;
  if(ft>500){document.getElementById('fps').textContent=Math.round(fc/ft*1000);fc=0;ft=0;}
  ctx.clearRect(0,0,W,H);
  t+=0.05;hue=(hue+0.8)%360;

  // Update 3D colors
  if(glowSphere){
    glowSphere.material.color.setHSL(hue/360,0.8,0.5);
    spiralBlades.forEach((b,i)=>b.material.color.setHSL(((hue+i*20)%360)/360,0.9,0.65));
    innerRings.forEach((r2,i)=>r2.material.color.setHSL(((hue+i*45)%360)/360,1,0.65));
  }

  // Chakra bar
  chakraFill.style.width=Math.round(power*100)+'%';
  chakraFill.style.background=`hsla(${hue},100%,60%,1)`;

  if(handLandmarks.length>0){
    power=Math.min(1,power+0.02);
    const lm=handLandmarks[0];
    drawHand(lm,power,hue);

    const pts=[0,1,5,9,13,17];let px=0,py=0;
    for(const i of pts){px+=(1-lm[i].x);py+=lm[i].y;}
    px/=pts.length;py/=pts.length;
    palmX=px*W;palmY=py*H;

    drawChidoriLightning(palmX,palmY,power,hue);

    // Screen flash
    if(power>0.85){
      const pulse=Math.sin(t*8)*0.5+0.5;
      ctx.fillStyle=`hsla(${hue},100%,70%,${0.07*(power-0.85)/0.15*pulse})`;
      ctx.fillRect(0,0,W,H);
    }

    // Explosion trigger at 100%
    if(power>=1 && !exploding && Math.random()<0.005){
      exploding=true;explodeTimer=0;
    }

    rGroup.position.set((px*2-1)*cam3.aspect*2.5,-(py*2-1)*2.5,0);
    const pulse2=1+Math.sin(t*5)*0.05*power;
    rGroup.scale.setScalar(power*0.85*pulse2);

    spiralBlades.forEach(b=>b.rotation.z+=b.userData.speed*(0.6+power*1.5));
    innerRings.forEach((ring,i)=>{
      if(i%3===0)ring.rotation.x+=ring.userData.speed*(1+power);
      else if(i%3===1)ring.rotation.y+=ring.userData.speed*(1+power);
      else ring.rotation.z+=ring.userData.speed*(1+power);
    });
    updateParticles(t);
    coreSphere.material.opacity=0.9+Math.sin(t*8)*0.1;
    glowSphere.material.opacity=0.4+Math.sin(t*4)*0.2;

    const txt=power>=1?'🔥 ULTIMATE! RASENSHURIKEN! 🔥':power>0.6?'⚡ Chakra mengalir deras!':'🌀 Kerahkan chakra lebih kuat!';
    document.getElementById('status').textContent=txt;

  } else {
    power=Math.max(0,power-0.04);
    document.getElementById('status').textContent='Kerahkan chakra! Buka telapak tangan ⚡';
    if(rGroup){
      rGroup.scale.setScalar(power*0.85);
      if(power>0){spiralBlades.forEach(b=>b.rotation.z+=b.userData.speed*0.3);updateParticles(t);}
    }
  }

  // Draw explosion
  if(exploding){
    drawExplosion(palmX,palmY,explodeTimer);
    explodeTimer++;
    if(explodeTimer>30){exploding=false;explodeTimer=0;}
  }

  document.getElementById('power').textContent=Math.round(power*100)+'%';
  if(renderer)renderer.render(scene,cam3);
}
setTimeout(initMP,300);
</script>
</body>
</html>
