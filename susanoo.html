<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Susanoo ⚡🔥</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { background: #000; overflow: hidden; font-family: 'Courier New', monospace; color: #fff; touch-action: none; }
#container { position: relative; width: 100vw; height: 100vh; }
#video { position: absolute; width: 100%; height: 100%; object-fit: cover; transform: scaleX(-1); opacity: 1; }
#canvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; }
#ui { position: absolute; top: 16px; left: 16px; z-index: 10; background: rgba(20,0,0,0.8); border: 1px solid rgba(255,80,0,0.5); border-radius: 10px; padding: 10px 14px; font-size: 11px; line-height: 1.8; }
#ui .label { color: #ff8844; } #ui .val { color: #fff; font-weight: bold; }
#status { position: absolute; bottom: 30px; left: 50%; transform: translateX(-50%); font-size: 14px; font-weight: bold; color: rgba(255,200,150,0.95); z-index: 10; background: rgba(30,0,0,0.7); padding: 10px 22px; border-radius: 20px; white-space: nowrap; text-shadow: 0 0 10px #ff4400; }
#loading { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; background: linear-gradient(180deg,#1a0500,#000); z-index: 100; gap: 16px; }
#loading h1 { font-size: 26px; background: linear-gradient(90deg,#ff4400,#ffaa00,#ff0066); -webkit-background-clip:text; -webkit-text-fill-color:transparent; letter-spacing: 3px; }
#loading p { color: #553322; font-size: 13px; }
.spinner { width: 40px; height: 40px; border: 3px solid #221100; border-top-color: #ff4400; border-radius: 50%; animation: spin 0.8s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
#startBtn { padding: 16px 36px; background: rgba(200,50,0,0.3); border: 2px solid #ff4400; color: #ffaa66; font-family: inherit; font-size: 16px; border-radius: 30px; cursor: pointer; letter-spacing: 2px; box-shadow: 0 0 20px rgba(255,68,0,0.5); }
#flashOverlay { position: absolute; inset: 0; background: #fff; opacity: 0; pointer-events: none; z-index: 50; }
#chakraBar { position: absolute; bottom: 75px; left: 50%; transform: translateX(-50%); width: 220px; height: 8px; background: rgba(255,255,255,0.1); border-radius: 10px; z-index: 10; overflow: hidden; border: 1px solid rgba(255,100,0,0.3); }
#chakraFill { height: 100%; width: 0%; background: linear-gradient(90deg,#ff4400,#ffaa00); transition: width 0.1s; }
</style>
</head>
<body>
<div id="container">
  <video id="video" playsinline muted></video>
  <canvas id="canvas"></canvas>
  <div id="flashOverlay"></div>
  <div id="ui">
    <div><span class="label">Chakra: </span><span class="val" id="power">0%</span></div>
    <div><span class="label">Mode: </span><span class="val" id="mode">Normal</span></div>
    <div><span class="label">FPS: </span><span class="val" id="fps">0</span></div>
  </div>
  <div id="chakraBar"><div id="chakraFill"></div></div>
  <div id="status">Angkat kedua tangan ke atas! ⚡</div>
</div>
<div id="loading">
  <h1>⚡ SUSANOO ⚡</h1>
  <p id="loadText">Membangkitkan chakra Uchiha...</p>
  <div class="spinner" id="spinner"></div>
  <button id="startBtn" style="display:none" onclick="startApp()">⚡ BANGKITKAN SUSANOO!</button>
</div>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands@0.4.1646424915/hands.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils@0.3.1640029074/camera_utils.js"></script>
<script>
const video=document.getElementById('video'),canvas=document.getElementById('canvas'),ctx=canvas.getContext('2d');
const flashOverlay=document.getElementById('flashOverlay'),chakraFill=document.getElementById('chakraFill');
let W,H;
function resize(){W=canvas.width=window.innerWidth;H=canvas.height=window.innerHeight;}
resize();window.addEventListener('resize',resize);

let handLandmarks=[],hands,t=0,power=0,bigStrikeTimer=0,nextBigStrike=50;
let screenShake={x:0,y:0,decay:0};

function lightning(x1,y1,x2,y2,rough,color,alpha,width=1){
  if(rough<2){
    ctx.save();ctx.globalAlpha=alpha;ctx.strokeStyle=color;
    ctx.lineWidth=width;ctx.shadowBlur=15;ctx.shadowColor=color;
    ctx.beginPath();ctx.moveTo(x1,y1);ctx.lineTo(x2,y2);ctx.stroke();ctx.restore();return;
  }
  const mx=(x1+x2)/2+(Math.random()-.5)*rough*2;
  const my=(y1+y2)/2+(Math.random()-.5)*rough*2;
  lightning(x1,y1,mx,my,rough/2,color,alpha,width);
  lightning(mx,my,x2,y2,rough/2,color,alpha,width);
}

function megaLightning(){
  const startX=Math.random()*W*0.6+W*0.2;
  const startY=-50;
  const endX=startX+(Math.random()-0.5)*W*0.4;
  const endY=H+50;

  for(let pass=0;pass<3;pass++){
    const offset=(pass-1)*8;
    lightning(startX+offset,startY,endX+offset,endY,80,
      pass===1?'rgba(255,255,255,1)':'rgba(255,150,80,0.8)',
      1,pass===1?3:1.5);
  }

  const branchCount=4+Math.floor(Math.random()*4);
  for(let i=0;i<branchCount;i++){
    const frac=Math.random();
    const bx=startX+(endX-startX)*frac;
    const by=startY+(endY-startY)*frac;
    const angle=(Math.random()-0.5)*Math.PI*0.8;
    const len=100+Math.random()*200;
    const bex=bx+Math.cos(angle)*len;
    const bey=by+Math.sin(angle)*len+100;
    lightning(bx,by,bex,bey,30,'rgba(255,180,100,0.7)',0.8,1);
  }

  flashOverlay.style.transition='opacity 0.05s';
  flashOverlay.style.opacity='0.45';
  setTimeout(()=>{
    flashOverlay.style.transition='opacity 0.35s';
    flashOverlay.style.opacity='0';
  },50);

  screenShake.decay=1;
}

function drawSusanooAura(handsArr,powerLevel){
  if(handsArr.length===0) return;
  let cx=0,cy=0,count=0;
  for(const lm of handsArr){
    for(const i of [0,5,9,13,17]){cx+=(1-lm[i].x)*W;cy+=lm[i].y*H;count++;}
  }
  cx/=count;cy/=count;

  const bodyTop=cy-50;
  const bodyBottom=H*0.95;
  const bodyCenterX=W/2;

  ctx.save();
  ctx.globalAlpha=powerLevel*0.7;

  const ribCount=6;
  for(let r=0;r<ribCount;r++){
    const yFrac=r/ribCount;
    const ribY=bodyTop+(bodyBottom-bodyTop)*yFrac;
    const ribWidth=(150+r*40)*powerLevel;
    const wobble=Math.sin(t*3+r)*15;
    ctx.strokeStyle=`hsla(${10+r*5},100%,${50+powerLevel*20}%,${0.6*powerLevel})`;
    ctx.lineWidth=3+powerLevel*2;ctx.shadowBlur=20;ctx.shadowColor='#ff4400';
    ctx.beginPath();
    ctx.moveTo(bodyCenterX-ribWidth/2+wobble,ribY);
    ctx.quadraticCurveTo(bodyCenterX+wobble,ribY-30,bodyCenterX+ribWidth/2+wobble,ribY);
    ctx.stroke();
  }

  ctx.strokeStyle=`hsla(15,100%,60%,${0.5*powerLevel})`;
  ctx.lineWidth=4;ctx.shadowBlur=25;
  ctx.beginPath();ctx.moveTo(bodyCenterX,bodyTop);ctx.lineTo(bodyCenterX,bodyBottom);ctx.stroke();

  if(powerLevel>0.65){
    const eyeY=bodyTop-80;
    const eyeSpacing=60*powerLevel;
    for(const dx of [-eyeSpacing,eyeSpacing]){
      const grad=ctx.createRadialGradient(bodyCenterX+dx,eyeY,0,bodyCenterX+dx,eyeY,25);
      grad.addColorStop(0,`rgba(255,255,255,${powerLevel})`);
      grad.addColorStop(0.4,`rgba(255,50,0,${powerLevel*0.8})`);
      grad.addColorStop(1,'rgba(255,0,0,0)');
      ctx.beginPath();ctx.arc(bodyCenterX+dx,eyeY,25,0,Math.PI*2);
      ctx.fillStyle=grad;ctx.fill();
    }
  }

  for(let i=0;i<Math.floor(powerLevel*20);i++){
    const px=bodyCenterX+(Math.random()-0.5)*200*powerLevel;
    const py=bodyBottom-((t*50+i*30)%(bodyBottom-bodyTop));
    ctx.globalAlpha=powerLevel*0.5*Math.random();
    ctx.beginPath();ctx.arc(px,py,2+Math.random()*3,0,Math.PI*2);
    ctx.fillStyle=`hsla(${20+Math.random()*20},100%,60%,1)`;
    ctx.shadowBlur=10;ctx.shadowColor='#ff6600';ctx.fill();
  }
  ctx.restore();
}

function drawHandLightning(lm,powerLevel){
  const pts=[0,5,9,13,17];
  let cx=0,cy=0;
  for(const i of pts){cx+=(1-lm[i].x)*W;cy+=lm[i].y*H;}
  cx/=pts.length;cy/=pts.length;
  const bolts=Math.floor(powerLevel*6)+1;
  for(let i=0;i<bolts;i++){
    const angle=Math.random()*Math.PI*2;
    const len=30+Math.random()*60*powerLevel;
    const ex=cx+Math.cos(angle)*len;
    const ey=cy+Math.sin(angle)*len;
    lightning(cx,cy,ex,ey,10,`hsla(${15+Math.random()*15},100%,70%,${0.7*powerLevel})`,0.7*powerLevel,1);
  }
}

const CONN=[[0,1],[1,2],[2,3],[3,4],[0,5],[5,6],[6,7],[7,8],[5,9],[9,10],[10,11],[11,12],[9,13],[13,14],[14,15],[15,16],[13,17],[17,18],[18,19],[19,20],[0,17]];
function drawHand(lm,powerLevel){
  ctx.save();ctx.globalAlpha=0.6+powerLevel*0.3;
  for(const[a,b]of CONN){
    const ax=(1-lm[a].x)*W,ay=lm[a].y*H,bx=(1-lm[b].x)*W,by=lm[b].y*H;
    ctx.strokeStyle=`hsla(20,100%,${60+powerLevel*30}%,0.9)`;
    ctx.lineWidth=2;ctx.shadowBlur=10*powerLevel;ctx.shadowColor='#ff6600';
    ctx.beginPath();ctx.moveTo(ax,ay);ctx.lineTo(bx,by);ctx.stroke();
  }
  for(const pt of lm){
    const x=(1-pt.x)*W,y=pt.y*H;
    ctx.beginPath();ctx.arc(x,y,4,0,Math.PI*2);
    ctx.fillStyle='rgba(255,220,180,0.9)';ctx.shadowBlur=12;ctx.shadowColor='#ff4400';ctx.fill();
  }
  ctx.restore();
}

function initMP(){
  hands=new Hands({locateFile:f=>`https://cdn.jsdelivr.net/npm/@mediapipe/hands@0.4.1646424915/${f}`});
  hands.setOptions({maxNumHands:2,modelComplexity:0,minDetectionConfidence:.6,minTrackingConfidence:.5});
  hands.onResults(r=>{handLandmarks=r.multiHandLandmarks||[];});
  document.getElementById('spinner').style.display='none';
  document.getElementById('startBtn').style.display='block';
  document.getElementById('loadText').textContent='Chakra Uchiha siap!';
}

async function startApp(){
  document.getElementById('startBtn').disabled=true;
  document.getElementById('startBtn').textContent='Menghubungkan...';
  try{
    const s=await navigator.mediaDevices.getUserMedia({video:{facingMode:'user',width:{ideal:640},height:{ideal:480}}});
    video.srcObject=s;await video.play();
    new Camera(video,{onFrame:async()=>{await hands.send({image:video});},width:640,height:480}).start();
    document.getElementById('loading').style.display='none';
    loop();
  }catch(e){
    document.getElementById('startBtn').textContent='❌ Izin Ditolak - Tap Lagi';
    document.getElementById('startBtn').disabled=false;
  }
}

let lt=0,fc=0,ft=0;
function loop(ts=0){
  requestAnimationFrame(loop);
  const dt=ts-lt;lt=ts;fc++;ft+=dt;
  if(ft>500){document.getElementById('fps').textContent=Math.round(fc/ft*1000);fc=0;ft=0;}

  if(screenShake.decay>0){
    screenShake.x=(Math.random()-0.5)*20*screenShake.decay;
    screenShake.y=(Math.random()-0.5)*20*screenShake.decay;
    screenShake.decay*=0.85;
    if(screenShake.decay<0.02)screenShake.decay=0;
  } else { screenShake.x=0;screenShake.y=0; }
  canvas.style.transform=`translate(${screenShake.x}px,${screenShake.y}px)`;
  video.style.transform=`scaleX(-1) translate(${screenShake.x}px,${screenShake.y}px)`;

  ctx.clearRect(0,0,W,H);
  t+=0.05;

  if(handLandmarks.length>0){
    power=Math.min(1,power+0.015);
    document.getElementById('mode').textContent=power>0.8?'SUSANOO!':power>0.4?'Bangkit...':'Normal';
    document.getElementById('status').textContent=power>0.8?'🔥 SUSANOO TELAH BANGKIT! 🔥':power>0.4?'⚡ Chakra meningkat...':'Angkat kedua tangan ke atas! ⚡';

    for(const lm of handLandmarks){drawHand(lm,power);drawHandLightning(lm,power);}
    drawSusanooAura(handLandmarks,power);

    if(power>0.5){
      ctx.fillStyle=`rgba(${100+Math.random()*50},30,0,${0.03*power})`;
      ctx.fillRect(0,0,W,H);
    }
  } else {
    power=Math.max(0,power-0.03);
    document.getElementById('mode').textContent='Normal';
    document.getElementById('status').textContent='Angkat kedua tangan ke atas! ⚡';
  }

  bigStrikeTimer++;
  if(power>0.55){
    if(bigStrikeTimer>nextBigStrike){
      megaLightning();
      bigStrikeTimer=0;
      nextBigStrike=35+Math.random()*50;
    }
  }

  chakraFill.style.width=Math.round(power*100)+'%';
  document.getElementById('power').textContent=Math.round(power*100)+'%';
}
setTimeout(initMP,300);
</script>
</body>
</html>
